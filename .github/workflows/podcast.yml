name: German episode production
on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode id (blank renders all ready episodes)
        type: string
        default: ''
      sample:
        description: Render a four-turn preview instead of the complete episode
        type: boolean
        default: false
      engine:
        description: Speech engine (auto uses each character's configured voice)
        type: choice
        options: [auto, piper, edge]
        default: auto
  push:
    branches: [main]
    paths: ['input/**', 'scripts/**', 'episodes/**', 'tests/**', '**.png', '**.jpg', '**.jpeg', 'requirements.txt', '.github/workflows/podcast.yml']
  pull_request:
    paths: ['input/**', 'scripts/**', 'episodes/**', 'tests/**', '**.png', '**.jpg', '**.jpeg', 'requirements.txt', '.github/workflows/podcast.yml']
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_jobs: ${{ steps.discover.outputs.has_jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.3
      - id: discover
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REQUESTED: ${{ inputs.episode }}
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          args=['python','scripts/discover_episodes.py']
          if os.environ['EVENT']!='workflow_dispatch' and os.environ['BASE']:
              args+=['--base',os.environ['BASE'],'--head',os.environ['GITHUB_SHA']]
          if os.environ['REQUESTED']:
              args+=['--episode',os.environ['REQUESTED']]
          matrix=json.loads(subprocess.check_output(args,text=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps(matrix)+'\n')
              f.write('has_jobs='+str(bool(matrix['include'])).lower()+'\n')
          print('Ready episodes:', ', '.join(item['slug'] for item in matrix['include']) or 'none (drafts are skipped)')
          PY
  render:
    permissions:
      contents: write
    needs: plan
    if: needs.plan.outputs.has_jobs == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install video and font tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Select required speech models
        id: voices
        env:
          EPISODE: ${{ matrix.episode }}
          ENGINE: ${{ inputs.engine || 'auto' }}
        run: |
          python - <<'PYTHON'
          import os, sys
          sys.path.insert(0, 'scripts')
          from episode_package import read_source
          data=read_source(os.environ['EPISODE'])
          override=os.environ['ENGINE']
          engines={p.get('engine','piper') for p in data['speakers'].values()} if override=='auto' else {override}
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for engine in ['piper','silero']:
                  output.write(engine+'='+str(engine in engines).lower()+'\n')
          PYTHON
      - uses: actions/cache@v4
        if: steps.voices.outputs.piper == 'true' || steps.voices.outputs.silero == 'true'
        with:
          path: models
          key: german-voices-thorsten-medium-silero-2e22f386-v1
      - name: Download Piper voices when selected
        if: steps.voices.outputs.piper == 'true'
        run: python -m piper.download_voices --data-dir models de_DE-thorsten-medium de_DE-kerstin-low
      - name: Download Silero when selected
        if: steps.voices.outputs.silero == 'true'
        run: python scripts/download_silero.py
      - uses: actions/cache/restore@v4
        id: speech_cache
        with:
          path: output/${{ matrix.slug }}/cache
          key: speech-${{ runner.os }}-${{ matrix.slug }}-${{ hashFiles('scripts/render_episode.py') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            speech-${{ runner.os }}-${{ matrix.slug }}-${{ hashFiles('scripts/render_episode.py') }}-
            speech-${{ runner.os }}-${{ matrix.slug }}-
      - name: Generate and verify episode
        id: render
        env:
          EPISODE: ${{ matrix.episode }}
          ENGINE: ${{ inputs.engine || 'auto' }}
          SAMPLE: ${{ github.event_name == 'pull_request' || inputs.sample == true }}
        run: |
          args=()
          if [ "$SAMPLE" = true ]; then args+=(--sample); fi
          python scripts/produce_episode.py --episode "$EPISODE" --engine "$ENGINE" "${args[@]}"
      - name: Publish complete episode to R2 when configured
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          S3_API: ${{ secrets.S3_API }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          EPISODE_ID: ${{ matrix.slug }}
        run: python scripts/upload_r2.py "output/$EPISODE_ID"
      - name: Save verified public delivery links
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.sample != true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EPISODE_ID: ${{ matrix.slug }}
        run: python scripts/publish_index.py "output/$EPISODE_ID"
      - name: Preserve completed speech turns, including after a failed run
        if: always() && steps.speech_cache.outcome == 'success' && steps.speech_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: output/${{ matrix.slug }}/cache
          key: ${{ steps.speech_cache.outputs.cache-primary-key }}
